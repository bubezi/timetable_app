<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Alarm</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon-32x32.png" />
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(255, 255, 255, 0.08);
        --panel-strong: rgba(255, 255, 255, 0.12);
        --border: rgba(255, 255, 255, 0.12);
        --text: #eef2ff;
        --muted: #9aa4c7;
        --accent: #7c9cff;
        --accent-2: #9a7cff;
        --danger: #ff6b81;
        --success: #6ee7b7;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        --radius: 24px;
        --radius-sm: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(124, 156, 255, 0.25),
            transparent 30%
          ),
          radial-gradient(
            circle at top right,
            rgba(154, 124, 255, 0.22),
            transparent 28%
          ),
          linear-gradient(180deg, #0a0f1d 0%, #0c1326 100%);
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: 100%;
        max-width: 760px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero {
        padding: 32px 28px 24px;
        border-bottom: 1px solid var(--border);
      }

      .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .time {
        font-size: clamp(52px, 10vw, 88px);
        line-height: 0.95;
        font-weight: 700;
        letter-spacing: -0.04em;
        margin: 0;
      }

      .date {
        margin-top: 10px;
        font-size: 15px;
        color: var(--muted);
      }

      .content {
        padding: 22px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .topbar h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
      }

      .add-btn {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--muted);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .add-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
        transform: translateY(-1px);
      }

      .alarms {
        display: grid;
        gap: 14px;
      }

      .alarm {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 16px;
      }

      .alarm-left {
        display: grid;
        gap: 12px;
      }

      .alarm-time-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .alarm-time {
        background: var(--panel-strong);
        color: var(--text);
        border: 1px solid transparent;
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 18px;
        min-width: 150px;
        outline: none;
      }

      .alarm-time::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.85;
      }

      .alarm-name {
        flex: 1;
        min-width: 160px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 14px;
        padding: 12px 14px;
        outline: none;
      }

      .alarm-name::placeholder {
        color: #8d97bb;
      }

      .alarm-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .toggle {
        position: relative;
        width: 56px;
        height: 32px;
        appearance: none;
        border: none;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .toggle::before {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: white;
        transition: 0.22s ease;
      }

      .toggle.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }

      .toggle.active::before {
        left: 28px;
      }

      .delete-btn,
      .stop-btn {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .delete-btn:hover,
      .stop-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
      }

      .stop-btn {
        color: #ffd5dc;
        border-color: rgba(255, 107, 129, 0.25);
      }

      .stop-btn:hover {
        background: rgba(255, 107, 129, 0.12);
        color: white;
      }

      .status {
        font-size: 13px;
        color: var(--muted);
      }

      .ringing {
        border-color: rgba(255, 107, 129, 0.45);
        box-shadow:
          0 0 0 1px rgba(255, 107, 129, 0.15),
          0 0 24px rgba(255, 107, 129, 0.12);
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.01);
        }
      }

      .footer-note {
        margin-top: 18px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 8px;
        color: #dfe7ff;
      }

      @media (max-width: 640px) {
        .alarm {
          grid-template-columns: 1fr;
        }

        .alarm-actions {
          justify-content: space-between;
        }

        .hero {
          padding: 24px 20px 18px;
        }

        .content {
          padding: 16px;
        }
      }

      /* Site nav */
      .site-nav {
        position: fixed;
        top: -70px; /* hidden above the viewport */
        left: 0;
        width: 100%;
        z-index: 1000;

        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        padding: 12px 16px;

        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        transition:
          top 0.25s ease,
          opacity 0.25s ease;

        opacity: 0;
      }
      .site-nav a {
        color: #9aa4c7;
        text-decoration: none;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 8px 12px;
        border-radius: 999px;
        transition: 0.2s ease;
      }
      .site-nav a:hover {
        color: #eef2ff;
        background: rgba(255, 255, 255, 0.06);
      }
      .site-nav a.active {
        color: #0b1020;
        background: linear-gradient(135deg, #7c9cff, #9a7cff);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <nav class="site-nav" id="siteNav">
      <a href="/index.html">Timetable</a>
      <a href="/alarm.html">Alarm</a>
      <a href="/clock/clock.html">Clock</a>
      <a href="/gold-calculator.html">Gold Calc</a>
    </nav>
    <div class="app">
      <section class="hero">
        <div class="label">Alarm Clock</div>
        <h1 class="time" id="currentTime">00:00:00</h1>
        <div class="date" id="currentDate">Loading date...</div>
      </section>

      <section class="content">
        <div class="topbar">
          <h2>Alarms</h2>
          <button class="add-btn" id="addAlarmBtn">+ Add alarm</button>
        </div>

        <div class="alarms" id="alarms"></div>

        <!-- <div class="footer-note">
          Put your sound file in the same folder as <code>alarm.html</code>. By
          default this page looks for <code>alarm.wav</code>. Browsers can be
          stubborn little goblins, so click anywhere once after opening the page
          to allow audio.
        </div> -->
      </section>
    </div>

    <script>
      // Change this filename to whatever sound file you place beside alarm.html
      const ALARM_SOUND_FILE = "alarm.wav";

      const alarmsContainer = document.getElementById("alarms");
      const addAlarmBtn = document.getElementById("addAlarmBtn");
      const currentTimeEl = document.getElementById("currentTime");
      const currentDateEl = document.getElementById("currentDate");

      let alarms = [];
      let activeAudio = null;
      let unlockedAudio = false;

      function saveAlarms() {
        localStorage.setItem("modern-alarms", JSON.stringify(alarms));
      }

      function loadAlarms() {
        const saved = localStorage.getItem("modern-alarms");
        if (saved) {
          try {
            alarms = JSON.parse(saved);
          } catch {
            alarms = [];
          }
        }

        if (!alarms.length) {
          alarms = [
            {
              id: crypto.randomUUID(),
              time: "07:00",
              label: "Wake up",
              enabled: false,
              ringing: false,
              lastTriggeredDate: null,
            },
          ];
        }
      }
      function formatTime24(now) {
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        const s = String(now.getSeconds()).padStart(2, "0");
        return `${h}:${m}:${s}`;
      }

      function formatNow() {
        const now = new Date();

        currentTimeEl.textContent = formatTime24(now);

        currentDateEl.textContent = now.toLocaleDateString([], {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      function getTodayKey() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function stopAlarm(alarmId) {
        const alarm = alarms.find((a) => a.id === alarmId);
        if (alarm) {
          alarm.ringing = false;
        }

        if (activeAudio) {
          activeAudio.pause();
          activeAudio.currentTime = 0;
          activeAudio = null;
        }

        saveAlarms();
        renderAlarms();
      }

      function stopAllAlarms() {
        alarms.forEach((a) => (a.ringing = false));
        if (activeAudio) {
          activeAudio.pause();
          activeAudio.currentTime = 0;
          activeAudio = null;
        }
        saveAlarms();
        renderAlarms();
      }

      async function ringAlarm(alarm) {
        stopAllAlarms();
        alarm.ringing = true;
        alarm.lastTriggeredDate = getTodayKey();
        saveAlarms();
        renderAlarms();

        try {
          activeAudio = new Audio(ALARM_SOUND_FILE);
          activeAudio.loop = true;
          await activeAudio.play();
        } catch (error) {
          console.error("Audio failed:", error);
          alert(
            `Alarm triggered, but sound could not play.\n\nMake sure "${ALARM_SOUND_FILE}" exists beside alarm.html and click the page once to allow audio.`,
          );
        }
      }

      function checkAlarms() {
        const now = new Date();
        const currentHHMM =
          String(now.getHours()).padStart(2, "0") +
          ":" +
          String(now.getMinutes()).padStart(2, "0");

        const todayKey = getTodayKey();

        for (const alarm of alarms) {
          if (!alarm.enabled) continue;
          if (alarm.ringing) continue;
          if (alarm.time !== currentHHMM) continue;
          if (alarm.lastTriggeredDate === todayKey) continue;

          ringAlarm(alarm);
          break;
        }
      }

      function renderAlarms() {
        alarmsContainer.innerHTML = "";

        alarms.forEach((alarm, index) => {
          const card = document.createElement("div");
          card.className = "alarm" + (alarm.ringing ? " ringing" : "");

          const left = document.createElement("div");
          left.className = "alarm-left";

          const timeRow = document.createElement("div");
          timeRow.className = "alarm-time-row";

          const timeInput = document.createElement("input");
          timeInput.type = "time";
          timeInput.className = "alarm-time";
          timeInput.value = alarm.time;
          timeInput.addEventListener("change", (e) => {
            alarm.time = e.target.value;
            alarm.lastTriggeredDate = null;
            saveAlarms();
            renderAlarms();
          });

          const nameInput = document.createElement("input");
          nameInput.type = "text";
          nameInput.className = "alarm-name";
          nameInput.placeholder = "Alarm label";
          nameInput.value = alarm.label || "";
          nameInput.addEventListener("input", (e) => {
            alarm.label = e.target.value;
            saveAlarms();
          });

          timeRow.appendChild(timeInput);
          timeRow.appendChild(nameInput);

          const status = document.createElement("div");
          status.className = "status";
          status.textContent = alarm.ringing
            ? "Ringing now"
            : alarm.enabled
              ? `Enabled • ${alarm.label?.trim() || `Alarm ${index + 1}`}`
              : "Disabled";

          left.appendChild(timeRow);
          left.appendChild(status);

          const actions = document.createElement("div");
          actions.className = "alarm-actions";

          const toggleBtn = document.createElement("button");
          toggleBtn.className = "toggle" + (alarm.enabled ? " active" : "");
          toggleBtn.title = alarm.enabled ? "Disable alarm" : "Enable alarm";
          toggleBtn.setAttribute("aria-label", toggleBtn.title);
          toggleBtn.addEventListener("click", () => {
            alarm.enabled = !alarm.enabled;
            if (!alarm.enabled && alarm.ringing) {
              stopAlarm(alarm.id);
              return;
            }
            saveAlarms();
            renderAlarms();
          });

          if (alarm.ringing) {
            const stopBtn = document.createElement("button");
            stopBtn.className = "stop-btn";
            stopBtn.textContent = "Stop";
            stopBtn.addEventListener("click", () => stopAlarm(alarm.id));
            actions.appendChild(stopBtn);
          }

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.textContent = "Delete";
          deleteBtn.disabled = alarms.length === 1;
          deleteBtn.style.opacity = alarms.length === 1 ? "0.45" : "1";
          deleteBtn.style.cursor =
            alarms.length === 1 ? "not-allowed" : "pointer";

          deleteBtn.addEventListener("click", () => {
            if (alarms.length === 1) return;
            if (alarm.ringing) stopAlarm(alarm.id);
            alarms = alarms.filter((a) => a.id !== alarm.id);
            saveAlarms();
            renderAlarms();
          });

          actions.appendChild(toggleBtn);
          actions.appendChild(deleteBtn);

          card.appendChild(left);
          card.appendChild(actions);
          alarmsContainer.appendChild(card);
        });
      }

      addAlarmBtn.addEventListener("click", () => {
        alarms.push({
          id: crypto.randomUUID(),
          time: "06:30",
          label: "",
          enabled: true,
          ringing: false,
          lastTriggeredDate: null,
        });
        saveAlarms();
        renderAlarms();
      });

      function unlockAudioOnce() {
        if (unlockedAudio) return;
        unlockedAudio = true;

        const audio = new Audio(ALARM_SOUND_FILE);
        audio.volume = 0;
        audio
          .play()
          .then(() => {
            audio.pause();
            audio.currentTime = 0;
          })
          .catch(() => {});
      }

      ["click", "touchstart", "keydown"].forEach((eventName) => {
        window.addEventListener(eventName, unlockAudioOnce, { once: true });
      });

      loadAlarms();
      renderAlarms();
      formatNow();
      checkAlarms();

      setInterval(formatNow, 1000);
      setInterval(checkAlarms, 1000);
    </script>
    <script>
      (function () {
        const path = window.location.pathname.replace(/\/+$/, "") || "/";
        document.querySelectorAll("#siteNav a").forEach((a) => {
          const href = a.getAttribute("href").replace(/\/+$/, "");
          if (
            path === href ||
            (href === "" && path === "/index.html") ||
            path.endsWith(href)
          ) {
            a.classList.add("active");
          }
        });
      })();
      const nav = document.getElementById("siteNav");

      let hideTimer = null;

      function showNav() {
        nav.style.top = "0";
        nav.style.opacity = "1";

        clearTimeout(hideTimer);
      }

      function hideNav() {
        hideTimer = setTimeout(() => {
          nav.style.top = "-70px";
          nav.style.opacity = "0";
        }, 300);
      }

      // Show when mouse is near the top of the window
      document.addEventListener("mousemove", (e) => {
        if (e.clientY < 20) {
          showNav();
        }
      });

      // Keep it visible while hovering it
      nav.addEventListener("mouseenter", () => {
        clearTimeout(hideTimer);
      });

      // Hide after leaving
      nav.addEventListener("mouseleave", hideNav);

      // Hide initially
      hideNav();
    </script>
  </body>
</html>
