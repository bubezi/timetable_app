<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown - July 6, 2026 · 7:02 PM</title>

    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.08);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #d8ffa4ff;
        --success: #4ade80;
      }

      * {
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
        overflow: hidden;
      }

      .card {
        position: relative;
        background: var(--card);
        backdrop-filter: blur(12px);
        padding: 3rem 2.5rem;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        max-width: 420px;
        width: 100%;
        z-index: 2;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      .subtitle {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 2rem;
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
      }

      .time-box {
        background: rgba(255, 255, 255, 0.06);
        padding: 1rem 0.5rem;
        border-radius: 12px;
      }

      .value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent);
      }

      .label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-top: 0.25rem;
      }

      /* 🎉 Celebration state */
      .celebration {
        animation: popIn 0.6s ease-out forwards;
      }

      .celebration h1 {
        color: var(--success);
        text-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
      }

      .celebration p {
        font-size: 1rem;
        margin-top: 1rem;
        color: var(--text);
      }

      @keyframes popIn {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* 🎊 Confetti */
      .confetti {
        position: absolute;
        top: -10px;
        width: 10px;
        height: 14px;
        background: var(--accent);
        opacity: 0.9;
        animation: fall linear forwards;
      }

      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="card" id="card">
      <h1 id="title">Countdown</h1>
      <div class="subtitle" id="subtitle">July 6, 2026 · 7:02 PM</div>

      <div id="countdown" class="countdown">
        <div class="time-box">
          <div id="days" class="value">0</div>
          <div class="label">Days</div>
        </div>
        <div class="time-box">
          <div id="hours" class="value">0</div>
          <div class="label">Hours</div>
        </div>
        <div class="time-box">
          <div id="minutes" class="value">0</div>
          <div class="label">Minutes</div>
        </div>
        <div class="time-box">
          <div id="seconds" class="value">0</div>
          <div class="label">Seconds</div>
        </div>
      </div>
    </div>

    <script>
      const targetDate = new Date("July 6, 2026 19:02:00").getTime();

      const els = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
        countdown: document.getElementById("countdown"),
        card: document.getElementById("card"),
        title: document.getElementById("title"),
        subtitle: document.getElementById("subtitle"),
      };

      function celebrate() {
        els.countdown.remove();
        els.subtitle.remove();

        els.card.classList.add("celebration");
        els.title.textContent = "🎉 It’s Time";

        const msg = document.createElement("p");
        msg.textContent = "The countdown is complete.";
        els.card.appendChild(msg);

        launchConfetti();
      }

      function launchConfetti() {
        for (let i = 0; i < 120; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = Math.random() * 100 + "vw";
          piece.style.background = Math.random() > 0.5 ? "#38bdf8" : "#4ade80";
          piece.style.animationDuration = 2 + Math.random() * 3 + "s";
          piece.style.animationDelay = Math.random() + "s";
          document.body.appendChild(piece);

          setTimeout(() => piece.remove(), 6000);
        }
      }

      function updateCountdown() {
        const now = Date.now();
        const diff = targetDate - now;

        if (diff <= 0) {
          clearInterval(timer);
          celebrate();
          return;
        }

        els.days.textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
        els.hours.textContent = Math.floor((diff / (1000 * 60 * 60)) % 24)
          .toString()
          .padStart(2, "0");
        els.minutes.textContent = Math.floor((diff / (1000 * 60)) % 60)
          .toString()
          .padStart(2, "0");
        els.seconds.textContent = Math.floor((diff / 1000) % 60)
          .toString()
          .padStart(2, "0");
      }

      updateCountdown();
      const timer = setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
