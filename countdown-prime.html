<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown - July 6, 2026 · 7:02 PM</title>

    <link rel="stylesheet" href="css/countdown-prime.css" />
  </head>

  <body>
    <div class="card" id="card">
      <h1 id="title">Countdown</h1>
      <div class="subtitle" id="subtitle">July 6, 2026 · 7:02 PM</div>

      <div id="countdown" class="countdown">
        <div class="time-box">
          <div id="days" class="value">0</div>
          <div class="label">Days</div>
        </div>
        <div class="time-box">
          <div id="hours" class="value">0</div>
          <div class="label">Hours</div>
        </div>
        <div class="time-box">
          <div id="minutes" class="value">0</div>
          <div class="label">Minutes</div>
        </div>
        <div class="time-box">
          <div id="seconds" class="value">0</div>
          <div class="label">Seconds</div>
        </div>
      </div>
    </div>

    <script src="js/countdown-prime.js"></script>
  </body>
</html>
